name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'README.md'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.auto-install-peers=false

      - name: Copy root files to public
        run: |
          mkdir -p docs/public
          cp -f llms.txt docs/public/llms.txt 2>/dev/null || true
          cp -f llms-full.txt docs/public/llms-full.txt 2>/dev/null || true

      - name: Build documentation
        run: pnpm run docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .dist-docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
